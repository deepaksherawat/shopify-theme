name: Shopify Theme Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push Theme
        run: shopify theme push --theme $THEME_ID --allow-live
        env:
          SHOPIFY_FLAG_STORE: b2bstore-u4jznknv.myshopify.com
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PASSWORD }}
          THEME_ID: 145249861706
